name: WebProof AI BBC Gemini Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4

      - name: BBC sayfasını Gemini ile analiz et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > test.py <<'PY'
          import os
          import urllib.request
          from bs4 import BeautifulSoup
          from google import genai

          URL = "https://www.bbc.com/turkce"

          print("======================================")
          print("WEBPROOF AI")
          print("BBC TÜRKÇE + GEMINI")
          print("======================================")
          print("")

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY bulunamadı."
              )

          print("BBC Türkçe indiriliyor...")

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("HTTP:", response.status)
          print("HTML karakter sayısı:", len(html))
          print("")

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          for tag in soup([
              "script",
              "style",
              "noscript",
              "svg"
          ]):
              tag.decompose()

          title = ""

          if soup.title:
              title = soup.title.get_text(
                  " ",
                  strip=True
              )

          main = soup.find("main")

          if main:
              text = main.get_text(
                  " ",
                  strip=True
              )
          else:
              text = soup.get_text(
                  " ",
                  strip=True
              )

          text = " ".join(
              text.split()
          )

          print("Sayfa başlığı:")
          print(title)
          print("")

          print(
              "Temiz metin karakter sayısı:",
              len(text)
          )

          if len(text) < 100:
              raise RuntimeError(
                  "BBC sayfasından yeterli metin alınamadı."
              )

          text = text[:12000]

          print("")
          print("Gemini'ye gönderiliyor...")

          client = genai.Client(
              api_key=api_key
          )

          prompt = f"""
Sen WebProof AI'ın Türkçe yazım denetimi uzmanısın.

Aşağıdaki BBC Türkçe sayfasındaki metni incele.

SADECE:

1. Yazım yanlışlarını
2. Noktalama yanlışlarını
3. Açık ve kesin dilbilgisi yanlışlarını

tespit et.

Kurallar:

- Emin olmadığın ifadeyi hata olarak gösterme.
- Özel isimleri hata olarak gösterme.
- Haber üslubunu hata kabul etme.
- Aynı hatayı tekrar listeleme.

Her hata için:

HATA:
YANLIŞ:
DOĞRU:
NEDEN:
GÜVEN:

formatını kullan.

Eğer belirgin bir hata yoksa:

BELİRGİN YAZIM HATASI BULUNAMADI

yaz.

BAŞLIK:
{title}

URL:
{URL}

METİN:
{text}
"""

          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents=prompt
          )

          print("")
          print("======================================")
          print("WEBPROOF AI SONUCU")
          print("======================================")
          print("")

          print(response.text)

          print("")
          print("======================================")
          print("TEST TAMAMLANDI")
          print("======================================")
          PY

          python test.py
