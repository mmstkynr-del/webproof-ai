name: WebProof AI - Web + Gemini Test

on:
  workflow_dispatch:

jobs:
  web-gemini-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gemini SDK kurulumu
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Web sayfasını indir ve Gemini'ye gönder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          from google import genai

          url = "https://example.com"

          print("WEB SAYFASI KONTROL EDİLİYOR:")
          print(url)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "WebProof-AI/1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("HTTP:", response.status)
          print("HTML karakter sayısı:", len(html))

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY bulunamadı."
              )

          client = genai.Client(
              api_key=api_key
          )

          prompt = """
          Sen WebProof AI'ın web analiz ajanısın.

          Aşağıda bir web sayfasının HTML içeriği var.

          Görevin:
          1. Sayfanın ne hakkında olduğunu belirle.
          2. Sayfadaki görünen metni analiz et.
          3. Türkçe veya İngilizce yazım hataları varsa tespit et.
          4. Hata varsa doğru yazımı öner.
          5. Emin olmadığın durumları hata olarak işaretleme.

          WEB SAYFASI:
          """ + html[:30000]

          print("")
          print("Gemini analiz ediyor...")

          max_retries = 4
          retry_delay = 5

          response = None

          for attempt in range(1, max_retries + 1):
              try:
                  print(
                      f"Gemini isteği: {attempt}/{max_retries}"
                  )

                  response = client.models.generate_content(
                      model="gemini-3.6-flash",
                      contents=prompt
                  )

                  print("Gemini yanıtı başarıyla alındı.")
                  break

              except Exception as error:
                  print("")
                  print("Gemini isteği başarısız oldu.")
                  print("Hata:", error)

                  if attempt == max_retries:
                      print("")
                      print("Tüm Gemini denemeleri başarısız oldu.")
                      raise

                  print(
                      f"{retry_delay} saniye sonra tekrar denenecek..."
                  )

                  time.sleep(retry_delay)

                  retry_delay *= 2

          if response is None:
              raise RuntimeError(
                  "Gemini'den yanıt alınamadı."
              )

          print("")
          print("====================================")
          print("GEMINI WEB ANALİZİ")
          print("====================================")
          print(response.text)
          print("====================================")
          PY
