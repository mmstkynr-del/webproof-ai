name: WebProof AI - BBC Yazım Denetimi

on:
  workflow_dispatch:

jobs:
  spelling-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4

      - name: BBC Türkçe sayfasını analiz et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > test.py <<'PY'
          import os
          import time
          import urllib.request
          from bs4 import BeautifulSoup
          from google import genai

          URL = "https://www.bbc.com/turkce"

          print("======================================")
          print("WEBPROOF AI")
          print("BBC TÜRKÇE YAZIM DENETİMİ")
          print("======================================")
          print("URL:", URL)
          print("")

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY bulunamadı."
              )

          print("BBC Türkçe indiriliyor...")

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("HTTP:", response.status)
          print("HTML karakter sayısı:", len(html))
          print("")

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          for tag in soup([
              "script",
              "style",
              "noscript",
              "svg",
              "nav",
              "footer",
              "header",
              "form"
          ]):
              tag.decompose()

          title = ""

          if soup.title:
              title = soup.title.get_text(
                  " ",
                  strip=True
              )

          main = soup.find("main")

          if main:
              text = main.get_text(
                  " ",
                  strip=True
              )
          else:
              text = soup.get_text(
                  " ",
                  strip=True
              )

          text = " ".join(
              text.split()
          )

          print("Sayfa başlığı:")
          print(title)
          print("")

          print(
              "Temiz metin karakter sayısı:",
              len(text)
          )

          if len(text) < 100:
              raise RuntimeError(
                  "BBC sayfasından yeterli metin alınamadı."
              )

          text = text[:12000]

          prompt = f"""
          Sen WebProof AI'ın Türkçe yazım denetimi uzmanısın.

          Aşağıdaki BBC Türkçe sayfasındaki metni incele.

          SADECE şu hataları tespit et:

          1. Yazım yanlışları
          2. Noktalama yanlışları
          3. Açık ve kesin dilbilgisi yanlışları

          KURALLAR:

          - Emin olmadığın ifadeyi hata olarak gösterme.
          - Özel isimleri hata olarak gösterme.
          - Haber üslubunu hata kabul etme.
          - Aynı hatayı tekrar listeleme.
          - Sadece açık ve kesin hatalara odaklan.
          - Bir kelimenin birden fazla doğru kullanımı varsa
            bunu hata olarak işaretleme.

          Her hata için şu formatı kullan:

          HATA 1
          YANLIŞ: ...
          DOĞRU: ...
          NEDEN: ...
          GÜVEN: Yüksek / Orta

          HATA 2
          YANLIŞ: ...
          DOĞRU: ...
          NEDEN: ...
          GÜVEN: Yüksek / Orta

          Belirgin hata yoksa:

          BELİRGİN YAZIM HATASI BULUNAMADI

          yaz.

          SAYFA BAŞLIĞI:
          {title}

          URL:
          {URL}

          SAYFA METNİ:
          {text}
          """

          print("")
          print("Gemini analizine başlanıyor...")
          print("")

          client = genai.Client(
              api_key=api_key
          )

          response = None
          retry_delay = 5

          for attempt in range(1, 5):

              try:

                  print(
                      f"Gemini denemesi {attempt}/4"
                  )

                  response = client.models.generate_content(
                      model="gemini-3.6-flash",
                      contents=prompt
                  )

                  print("Gemini başarılı.")
                  break

              except Exception as error:

                  print("")
                  print("Gemini hatası:")
                  print(error)
                  print("")

                  if attempt == 4:
                      print(
                          "4 denemenin tamamı başarısız oldu."
                      )
                      raise

                  print(
                      f"{retry_delay} saniye sonra "
                      "tekrar denenecek..."
                  )

                  time.sleep(retry_delay)

                  retry_delay *= 2

          if response is None:
              raise RuntimeError(
                  "Gemini'den cevap alınamadı."
              )

          print("")
          print("======================================")
          print("WEBPROOF AI SONUCU")
          print("======================================")
          print("")

          print(response.text)

          print("")
          print("======================================")
          print("TEST TAMAMLANDI")
          print("======================================")
          PY

          python test.py
