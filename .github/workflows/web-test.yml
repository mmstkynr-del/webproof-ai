name: WebProof AI - Temiz Haber Metni Testi

on:
  workflow_dispatch:

jobs:
  webproof-clean-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4 requests

      - name: WebProof AI temiz metin testi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > webproof_test.py <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from google import genai
          import re
          import time

          BBC_URL = "https://www.bbc.com/turkce"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/139.0.0.0 Safari/537.36"
              )
          }

          print("=" * 70)
          print("WEBPROOF AI - TEMİZ HABER METNİ TESTİ")
          print("=" * 70)

          # ------------------------------------------------------------
          # 1. BBC ana sayfasını indir
          # ------------------------------------------------------------

          print("\n[1] BBC ana sayfası indiriliyor...")

          response = requests.get(
              BBC_URL,
              headers=HEADERS,
              timeout=20
          )

          print("HTTP:", response.status_code)
          print("HTML uzunluğu:", len(response.text))

          soup = BeautifulSoup(response.text, "html.parser")

          # ------------------------------------------------------------
          # 2. Haber bağlantılarını bul
          # ------------------------------------------------------------

          print("\n[2] Haber bağlantıları aranıyor...")

          article_urls = []

          for a in soup.find_all("a", href=True):

              href = a["href"].strip()

              if href.startswith("/turkce/articles/"):
                  full_url = "https://www.bbc.com" + href

                  if "?" in full_url:
                      full_url = full_url.split("?")[0]

                  if full_url not in article_urls:
                      article_urls.append(full_url)

          print("Bulunan benzersiz haber:", len(article_urls))

          # İlk 5 haber
          article_urls = article_urls[:5]

          print("\nTest edilecek haberler:")

          for i, url in enumerate(article_urls, 1):
              print(f"{i}. {url}")

          # ------------------------------------------------------------
          # 3. Haber metnini temizle
          # ------------------------------------------------------------

          def extract_clean_article(url):

              print("\n" + "-" * 70)
              print("Haber indiriliyor:")
              print(url)

              try:
                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=20
                  )

                  print("HTTP:", r.status_code)

                  if r.status_code != 200:
                      return None

                  page = BeautifulSoup(r.text, "html.parser")

                  # Gereksiz HTML elementlerini kaldır
                  remove_tags = [
                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer",
                      "header",
                      "form",
                      "aside"
                  ]

                  for tag_name in remove_tags:
                      for tag in page.find_all(tag_name):
                          tag.decompose()

                  # ----------------------------------------------------
                  # Öncelik: main
                  # ----------------------------------------------------

                  main = page.find("main")

                  if main:
                      container = main
                  else:
                      container = page.body

                  if not container:
                      return None

                  # Gereksiz metinleri taşıyan alanları kaldır
                  bad_phrases = [
                      "WhatsApp",
                      "Haberin başlığını atlayın",
                      "okumaya devam edin",
                      "En çok okunanlar",
                      "İlgili",
                      "Bizi takip edin",
                      "BBC News Türkçe",
                      "Çerez",
                      "Gizlilik",
                      "Kullanım koşulları",
                      "Menü",
                      "Ana sayfa"
                  ]

                  # Bazı elementleri içerdiği metne göre kaldır
                  for element in container.find_all(
                      ["div", "section", "aside", "p", "span"]
                  ):

                      text = element.get_text(
                          " ",
                          strip=True
                      )

                      if not text:
                          continue

                      if any(
                          phrase.lower() in text.lower()
                          for phrase in bad_phrases
                      ):
                          element.decompose()

                  # ----------------------------------------------------
                  # Başlık
                  # ----------------------------------------------------

                  title = ""

                  h1 = container.find("h1")

                  if h1:
                      title = h1.get_text(
                          " ",
                          strip=True
                      )

                  # ----------------------------------------------------
                  # Paragrafları çıkar
                  # ----------------------------------------------------

                  paragraphs = []

                  for p in container.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if not text:
                          continue

                      # Çok kısa menü parçalarını ele
                      if len(text) < 20:
                          continue

                      # Gereksiz içerik
                      if any(
                          phrase.lower() in text.lower()
                          for phrase in bad_phrases
                      ):
                          continue

                      paragraphs.append(text)

                  # Tekrar eden paragrafları kaldır
                  unique_paragraphs = []

                  seen = set()

                  for text in paragraphs:

                      normalized = re.sub(
                          r"\s+",
                          " ",
                          text
                      ).strip()

                      key = normalized.lower()

                      if key in seen:
                          continue

                      seen.add(key)
                      unique_paragraphs.append(normalized)

                  # ----------------------------------------------------
                  # Son metni oluştur
                  # ----------------------------------------------------

                  parts = []

                  if title:
                      parts.append(title)

                  parts.extend(unique_paragraphs)

                  text = "\n\n".join(parts)

                  # Fazla boşlukları temizle
                  text = re.sub(
                      r"\n{3,}",
                      "\n\n",
                      text
                  )

                  text = re.sub(
                      r"[ \t]{2,}",
                      " ",
                      text
                  )

                  return {
                      "title": title,
                      "text": text
                  }

              except Exception as e:

                  print("HATA:", e)

                  return None

          # ------------------------------------------------------------
          # 4. Haberleri temizle
          # ------------------------------------------------------------

          articles = []

          for i, url in enumerate(article_urls, 1):

              result = extract_clean_article(url)

              if not result:
                  print("Metin alınamadı.")
                  continue

              text = result["text"]

              print("Başlık:", result["title"])
              print("Temiz metin uzunluğu:", len(text))

              print("\nİlk 500 karakter:")
              print(text[:500])

              articles.append({
                  "url": url,
                  "title": result["title"],
                  "text": text
              })

          # ------------------------------------------------------------
          # 5. Özet
          # ------------------------------------------------------------

          print("\n" + "=" * 70)
          print("TEMİZ METİN TEST SONUCU")
          print("=" * 70)

          print("Toplam haber:", len(articles))

          for i, article in enumerate(articles, 1):

              print(
                  f"{i}. "
                  f"{len(article['text'])} karakter - "
                  f"{article['title']}"
              )

          # ------------------------------------------------------------
          # 6. Gemini testi
          # ------------------------------------------------------------

          print("\n" + "=" * 70)
          print("GEMINI YAZIM DENETİMİ")
          print("=" * 70)

          client = genai.Client(
              api_key=__import__("os").environ["GEMINI_API_KEY"]
          )

          for i, article in enumerate(articles, 1):

              print("\n" + "-" * 70)
              print(f"GEMINI TESTİ {i}/{len(articles)}")
              print(article["title"])

              prompt = f"""
          Sen profesyonel bir Türkçe haber editörüsün.

          Aşağıdaki haber metnini yalnızca açık ve kesin:
          - yazım yanlışları
          - noktalama yanlışları
          - bariz dilbilgisi hataları
          açısından kontrol et.

          Emin olmadığın ifadeleri HATA olarak gösterme.

          Özellikle siyasi veya haber dilindeki tercihleri
          gereksiz yere değiştirme.

          Her hata için şu formatı kullan:

          HATA:
          DÜZELTME:
          NEDEN:

          Eğer açık bir hata yoksa:
          "Açık bir yazım veya dilbilgisi hatası bulunamadı."
          yaz.

          HABER:

          {article["text"][:10000]}
          """

              success = False

              for attempt, delay in [
                  (1, 0),
                  (2, 5),
                  (3, 10),
                  (4, 20)
              ]:

                  if delay:
                      time.sleep(delay)

                  try:

                      print(
                          f"Gemini denemesi {attempt}/4..."
                      )

                      result = client.models.generate_content(
                          model="gemini-3.6-flash",
                          contents=prompt
                      )

                      print("\nGEMINI SONUCU:\n")
                      print(result.text)

                      success = True
                      break

                  except Exception as e:

                      print(
                          f"Gemini hatası: {e}"
                      )

              if not success:
                  print(
                      "Bu haber için Gemini analizi başarısız."
                  )

          print("\n" + "=" * 70)
          print("TEST TAMAMLANDI")
          print("=" * 70)
          PY

          python webproof_test.py
