name: WebProof AI - NVIDIA Test

on:
  workflow_dispatch:

jobs:
  webproof-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: NVIDIA test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > test_nvidia.py <<'PYTHON'
          import os
          import requests

          API_URL = "https://integrate.api.nvidia.com/v1/chat/completions"
          MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1"

          api_key = os.environ["NVIDIA_API_KEY"]

          print("========================================")
          print("WEBPROOF AI - NVIDIA API TEST")
          print("========================================")

          payload = {
              "model": MODEL,
              "messages": [
                  {
                      "role": "system",
                      "content": "Sen profesyonel bir Türkçe haber editörüsün."
                  },
                  {
                      "role": "user",
                      "content": """
                      Aşağıdaki cümlede yalnızca açık yazım,
                      noktalama veya dilbilgisi hatalarını bul.

                      Cümle:
                      "Türkiye Avrupa Voleybol Şampiyonasında Azerbaycanı eleyerek çeyrek finale çıktı."

                      Şu formatı kullan:

                      Orijinal:
                      Öneri:
                      Açıklama:
                      """
                  }
              ],
              "temperature": 0.1,
              "max_tokens": 500,
              "stream": False
          }

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json"
          }

          try:
              response = requests.post(
                  API_URL,
                  headers=headers,
                  json=payload,
                  timeout=120
              )

              print(f"NVIDIA HTTP: {response.status_code}")
              print()

              if response.status_code == 200:
                  data = response.json()
                  answer = data["choices"][0]["message"]["content"]

                  print("NVIDIA BAŞARILI")
                  print("========================================")
                  print(answer)

              else:
                  print("NVIDIA API HATASI")
                  print("========================================")
                  print(response.text)

          except Exception as e:
              print("BAĞLANTI HATASI")
              print(str(e))
              raise
          PYTHON

          python test_nvidia.py
