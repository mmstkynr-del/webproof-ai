name: WebProof AI - Gemini Kota Kontrolü

on:
  workflow_dispatch:

jobs:
  webproof-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4 requests

      - name: BBC haberlerini tara ve Gemini ile kontrol et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          import time
          import hashlib
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from google import genai

          BASE_URL = "https://www.bbc.com/turkce"
          MODEL = "gemini-3.6-flash"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          print("========================================")
          print("WEBPROOF AI")
          print("Gemini kota kontrollü test")
          print("========================================")

          # ----------------------------------------
          # 1. BBC ana sayfasını al
          # ----------------------------------------

          response = requests.get(
              BASE_URL,
              headers=headers,
              timeout=15
          )

          print(f"BBC HTTP: {response.status_code}")

          soup = BeautifulSoup(response.text, "html.parser")

          # ----------------------------------------
          # 2. Haber bağlantılarını bul
          # ----------------------------------------

          article_urls = []

          for a in soup.find_all("a", href=True):
              href = urljoin(BASE_URL, a["href"])
              parsed = urlparse(href)

              if parsed.netloc not in ["www.bbc.com", "bbc.com"]:
                  continue

              if parsed.path.startswith("/turkce/articles/"):
                  clean_url = (
                      f"https://www.bbc.com{parsed.path}"
                  )

                  if clean_url not in article_urls:
                      article_urls.append(clean_url)

          print(f"Bulunan haber bağlantısı: {len(article_urls)}")

          article_urls = article_urls[:5]

          # ----------------------------------------
          # 3. Temiz haber metni çıkar
          # ----------------------------------------

          def extract_article(url):

              r = requests.get(
                  url,
                  headers=headers,
                  timeout=15
              )

              if r.status_code != 200:
                  print(f"  HTTP hata: {r.status_code}")
                  return None

              soup = BeautifulSoup(r.text, "html.parser")

              for tag in soup([
                  "script",
                  "style",
                  "noscript",
                  "svg",
                  "nav",
                  "footer",
                  "header",
                  "form",
                  "aside",
                  "iframe"
              ]):
                  tag.decompose()

              main = soup.find("main")

              if not main:
                  main = soup.body

              if not main:
                  return None

              paragraphs = []

              for p in main.find_all("p"):
                  text = p.get_text(" ", strip=True)

                  if len(text) >= 25:
                      text = re.sub(r"\s+", " ", text)

                      if text not in paragraphs:
                          paragraphs.append(text)

              text = "\n\n".join(paragraphs)

              return text[:12000]

          # ----------------------------------------
          # 4. Gemini
          # ----------------------------------------

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          successful = 0
          quota_hit = False

          for index, url in enumerate(article_urls, 1):

              print()
              print("========================================")
              print(f"HABER {index}/{len(article_urls)}")
              print(url)
              print("========================================")

              text = extract_article(url)

              if not text:
                  print("Metin alınamadı.")
                  continue

              print(f"Metin uzunluğu: {len(text)} karakter")

              prompt = f"""
          Sen profesyonel bir Türkçe haber editörüsün.

          Aşağıdaki haber metnini yalnızca gerçekten açık olan:

          - yazım hataları
          - noktalama hataları
          - açık dilbilgisi hataları
          - kelime içindeki bariz harf hataları
          - bariz boşluk hataları

          açısından kontrol et.

          Siyasi, hukuki, ekonomik veya haber dilini gereksiz yere değiştirme.

          Özel isimleri, kurum isimlerini ve kişi isimlerini değiştirme.

          Emin olmadığın bir ifadeyi HATA olarak gösterme.

          Her hata için şu formatı kullan:

          HATA:
          Orijinal: ...
          Öneri: ...
          Açıklama: ...

          Hiç hata yoksa:

          HATA YOK

          Haber metni:

          {text}
          """

              # 503 için sınırlı tekrar
              # 429 için TEKRAR YOK

              result = None

              for attempt in range(3):

                  try:

                      print(f"Gemini denemesi: {attempt + 1}")

                      result = client.models.generate_content(
                          model=MODEL,
                          contents=prompt
                      )

                      successful += 1

                      print()
                      print(result.text)

                      break

                  except Exception as e:

                      error = str(e)

                      # --------------------------------
                      # 429 = kota doldu
                      # --------------------------------

                      if "429" in error or "RESOURCE_EXHAUSTED" in error:

                          print()
                          print("⚠️ GEMINI KOTASI DOLDU.")
                          print("Bu haber atlanıyor.")
                          print("429 hatasında tekrar denenmeyecek.")

                          quota_hit = True
                          break

                      # --------------------------------
                      # 503 = geçici sunucu problemi
                      # --------------------------------

                      if "503" in error or "UNAVAILABLE" in error:

                          if attempt < 2:

                              wait = 5 * (2 ** attempt)

                              print(
                                  f"Gemini geçici olarak kullanılamıyor."
                              )
                              print(
                                  f"{wait} saniye sonra tekrar denenecek."
                              )

                              time.sleep(wait)

                              continue

                          print("503 hatası: tekrar hakkı bitti.")
                          break

                      # --------------------------------
                      # Diğer hatalar
                      # --------------------------------

                      print("Gemini hatası:")
                      print(error)
                      break

              if quota_hit:
                  print()
                  print("Kota nedeniyle kalan haberler atlanıyor.")
                  break

          # ----------------------------------------
          # 5. Sonuç
          # ----------------------------------------

          print()
          print("========================================")
          print("TEST SONUCU")
          print("========================================")
          print(f"Başarılı Gemini analizi: {successful}")
          print(f"Toplam haber: {len(article_urls)}")

          if quota_hit:
              print("Durum: GEMINI KOTASI DOLDU")
          else:
              print("Durum: TEST TAMAMLANDI")

          print("========================================")
          PY
