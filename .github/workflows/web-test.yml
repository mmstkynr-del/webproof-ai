name: WebProof AI - NVIDIA Haber Denetimi

on:
  workflow_dispatch:

jobs:
  webproof-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install openai beautifulsoup4 requests

      - name: BBC haberlerini NVIDIA ile kontrol et
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > webproof_nvidia.py <<'PYTHON'

          import os
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from openai import OpenAI

          BASE_URL = "https://www.bbc.com/turkce"
          API_URL = "https://integrate.api.nvidia.com/v1"
          MODEL = "nvidia/nemotron-3.5-lightning-30b-a3b"

          client = OpenAI(
              base_url=API_URL,
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          print("========================================")
          print("WEBPROOF AI")
          print("NVIDIA HABER DENETİMİ")
          print("========================================")

          # ----------------------------------------
          # BBC ana sayfasını al
          # ----------------------------------------

          response = requests.get(
              BASE_URL,
              headers=headers,
              timeout=15
          )

          print(f"BBC HTTP: {response.status_code}")

          soup = BeautifulSoup(response.text, "html.parser")

          # ----------------------------------------
          # Haber bağlantılarını bul
          # ----------------------------------------

          article_urls = []

          for a in soup.find_all("a", href=True):

              href = urljoin(BASE_URL, a["href"])
              parsed = urlparse(href)

              if parsed.netloc not in ["www.bbc.com", "bbc.com"]:
                  continue

              if parsed.path.startswith("/turkce/articles/"):

                  clean_url = f"https://www.bbc.com{parsed.path}"

                  if clean_url not in article_urls:
                      article_urls.append(clean_url)

          print(f"Bulunan haber: {len(article_urls)}")

          # İlk 5 haber
          article_urls = article_urls[:5]

          # ----------------------------------------
          # Haber metnini temizle
          # ----------------------------------------

          def extract_article(url):

              r = requests.get(
                  url,
                  headers=headers,
                  timeout=15
              )

              if r.status_code != 200:
                  print(f"Haber HTTP hatası: {r.status_code}")
                  return None

              soup = BeautifulSoup(r.text, "html.parser")

              for tag in soup([
                  "script",
                  "style",
                  "noscript",
                  "svg",
                  "nav",
                  "footer",
                  "header",
                  "form",
                  "aside",
                  "iframe"
              ]):
                  tag.decompose()

              main = soup.find("main")

              if not main:
                  main = soup.body

              if not main:
                  return None

              paragraphs = []

              for p in main.find_all("p"):

                  text = p.get_text(" ", strip=True)
                  text = re.sub(r"\s+", " ", text)

                  if len(text) >= 25:

                      if text not in paragraphs:
                          paragraphs.append(text)

              text = "\n\n".join(paragraphs)

              return text[:12000]

          # ----------------------------------------
          # NVIDIA analizi
          # ----------------------------------------

          successful = 0

          for index, url in enumerate(article_urls, 1):

              print()
              print("========================================")
              print(f"HABER {index}/{len(article_urls)}")
              print(url)
              print("========================================")

              text = extract_article(url)

              if not text:
                  print("Metin alınamadı.")
                  continue

              print(f"Metin uzunluğu: {len(text)} karakter")

              prompt = f"""
Sen profesyonel bir Türkçe haber editörüsün.

Aşağıdaki haber metnini yalnızca şu konularda kontrol et:

- Yazım hataları
- Noktalama hataları
- Açık dilbilgisi hataları
- Bariz harf hataları
- Bariz boşluk hataları

ÖNEMLİ KURALLAR:

1. Emin olmadığın ifadeyi hata olarak gösterme.
2. Siyasi veya hukuki anlamı değiştirme.
3. Özel isimleri değiştirme.
4. Kurum isimlerini değiştirme.
5. Haber üslubunu gereksiz yere değiştirme.
6. Sadece açıkça hatalı olan ifadeleri bildir.

Her hata için:

HATA:
Orijinal: ...
Öneri: ...
Açıklama: ...

Hiç hata yoksa:

HATA YOK

HABER:

{text}
"""

              try:

                  completion = client.chat.completions.create(
                      model=MODEL,
                      messages=[
                          {
                              "role": "system",
                              "content": "Sen profesyonel Türkçe haber editörüsün."
                          },
                          {
                              "role": "user",
                              "content": prompt
                          }
                      ],
                      temperature=0.1,
                      top_p=0.95,
                      max_tokens=4000,
                      stream=False
                  )

                  answer = completion.choices[0].message.content

                  successful += 1

                  print()
                  print("NVIDIA SONUCU:")
                  print("----------------------------------------")
                  print(answer)

              except Exception as e:

                  print()
                  print("NVIDIA HATASI:")
                  print(str(e))

          # ----------------------------------------
          # SONUÇ
          # ----------------------------------------

          print()
          print("========================================")
          print("TEST TAMAMLANDI")
          print("========================================")
          print(f"Başarılı analiz: {successful}")
          print(f"Toplam haber: {len(article_urls)}")
          print("========================================")

          PYTHON

          python webproof_nvidia.py
