name: WebProof AI - BBC Türkçe Yazım Testi

on:
  workflow_dispatch:

jobs:
  bbc-spelling-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4

      - name: BBC Türkçe sitesini tara ve Gemini ile analiz et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import hashlib
          import urllib.request
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup
          from google import genai

          START_URL = "https://www.bbc.com/turkce"
          MAX_PAGES = 20

          print("======================================")
          print("WEBPROOF AI - BBC TÜRKÇE TARAMASI")
          print("======================================")
          print("Başlangıç:", START_URL)
          print("Maksimum sayfa:", MAX_PAGES)
          print("")

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY bulunamadı.")

          client = genai.Client(api_key=api_key)

          visited = set()
          queue = [START_URL]

          def get_page(url):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "WebProof-AI/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      if response.status != 200:
                          print(
                              f"HTTP {response.status}: {url}"
                          )
                          return None

                      content_type = response.headers.get(
                          "Content-Type",
                          ""
                      )

                      if "text/html" not in content_type:
                          return None

                      return response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

              except Exception as error:
                  print(f"Sayfa alınamadı: {url}")
                  print(f"Hata: {error}")
                  return None

          def clean_page(html):
              soup = BeautifulSoup(
                  html,
                  "html.parser"
              )

              for tag in soup([
                  "script",
                  "style",
                  "noscript",
                  "svg",
                  "nav",
                  "footer",
                  "header",
                  "form"
              ]):
                  tag.decompose()

              title = ""

              if soup.title:
                  title = soup.title.get_text(
                      " ",
                      strip=True
                  )

              main = soup.find("main")

              if main:
                  text = main.get_text(
                      " ",
                      strip=True
                  )
              else:
                  text = soup.get_text(
                      " ",
                      strip=True
                  )

              text = " ".join(
                  text.split()
              )

              return title, text

          def find_links(html, current_url):
              soup = BeautifulSoup(
                  html,
                  "html.parser"
              )

              current_domain = urlparse(
                  START_URL
              ).netloc

              links = []

              for a in soup.find_all("a", href=True):
                  href = a.get("href")

                  if not href:
                      continue

                  absolute = urljoin(
                      current_url,
                      href
                  )

                  parsed = urlparse(absolute)

                  if parsed.scheme not in (
                      "http",
                      "https"
                  ):
                      continue

                  if parsed.netloc != current_domain:
                      continue

                  clean_url = (
                      parsed.scheme
                      + "://"
                      + parsed.netloc
                      + parsed.path
                  )

                  if parsed.query:
                      clean_url += "?" + parsed.query

                  if clean_url not in visited:
                      links.append(clean_url)

              return links

          while queue and len(visited) < MAX_PAGES:

              url = queue.pop(0)

              if url in visited:
                  continue

              visited.add(url)

              print("")
              print("--------------------------------------")
              print(
                  f"SAYFA {len(visited)}/{MAX_PAGES}"
              )
              print(url)
              print("--------------------------------------")

              html = get_page(url)

              if not html:
                  continue

              print(
                  "HTML karakter sayısı:",
                  len(html)
              )

              title, text = clean_page(html)

              print(
                  "Temiz metin karakter sayısı:",
                  len(text)
              )

              if len(text) < 100:
                  print(
                      "Metin çok kısa, Gemini'ye gönderilmiyor."
                  )
                  continue

              links = find_links(
                  html,
                  url
              )

              print(
                  "Yeni link sayısı:",
                  len(links)
              )

              for link in links:
                  if link not in queue:
                      queue.append(link)

              text_for_ai = text[:12000]

              prompt = f"""
Sen WebProof AI'ın Türkçe yazım denetimi uzmanısın.

Aşağıdaki BBC Türkçe web sayfasını yalnızca
Türkçe yazım ve dil kullanımı açısından incele.

Görevin:

1. Açık ve kesin yazım hatalarını bul.
2. Noktalama hatalarını bul.
3. Açık dilbilgisi hatalarını bul.
4. Yanlış yazılmış kelimeleri doğru biçimleriyle göster.
5. Özel isimleri hata olarak işaretleme.
6. Haber üslubunu veya gazetecinin tercihlerini
   gereksiz yere hata kabul etme.
7. Emin olmadığın bir ifadeyi hata olarak bildirme.
8. Aynı hatayı tekrar tekrar listeleme.

Her hata için:

YANLIŞ:
DOĞRU:
NEDEN:
GÜVEN:

şeklinde sonuç ver.

Eğer belirgin bir hata yoksa:

BELİRGİN YAZIM HATASI BULUNAMADI

yaz.

URL:
{url}

BAŞLIK:
{title}

SAYFA METNİ:
{text_for_ai}
"""

              print("")
              print("Gemini analiz ediyor...")

              response = None
              retry_delay = 5

              for attempt in range(1, 5):

                  try:

                      print(
                          f"Gemini denemesi "
                          f"{attempt}/4"
                      )

                      response = (
                          client.models.generate_content(
                              model="gemini-3.6-flash",
                              contents=prompt
                          )
                      )

                      break

                  except Exception as error:

                      print(
                          "Gemini hatası:",
                          error
                      )

                      if attempt == 4:
                          print(
                              "Bu sayfa atlanıyor."
                          )
                          break

                      print(
                          f"{retry_delay} saniye "
                          "sonra tekrar denenecek..."
                      )

                      time.sleep(
                          retry_delay
                      )

                      retry_delay *= 2

              if response:

                  print("")
                  print(
                      "========== GEMINI ANALİZİ =========="
                  )

                  print(
                      response.text
                  )

                  print(
                      "===================================="
                  )

              time.sleep(1)

          print("")
          print("======================================")
          print("BBC TÜRKÇE TARAMASI TAMAMLANDI")
          print("Taranan sayfa:", len(visited))
          print("======================================")
          PY
