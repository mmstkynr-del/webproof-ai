name: WebProof AI - BBC Haber Metin Crawler

on:
  workflow_dispatch:

jobs:
  article-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: BBC haberlerini indir ve metinlerini çıkar
        run: |
          cat > crawler.py <<'PY'
          import urllib.request
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup

          BASE_URL = "https://www.bbc.com/turkce"

          print("======================================")
          print("WEBPROOF AI")
          print("BBC HABER METİN CRAWLER")
          print("======================================")
          print("")
          print("Ana sayfa:", BASE_URL)
          print("")

          def download_page(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      html = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      return response.status, html

              except Exception as error:

                  print("Sayfa indirilemedi:")
                  print(error)
                  return None, None


          print("BBC Türkçe ana sayfası indiriliyor...")

          status, html = download_page(BASE_URL)

          if not html:
              raise RuntimeError(
                  "BBC ana sayfası indirilemedi."
              )

          print("HTTP:", status)
          print(
              "HTML karakter sayısı:",
              len(html)
          )
          print("")

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          links = []

          for a in soup.find_all(
              "a",
              href=True
          ):

              href = a.get("href")

              if not href:
                  continue

              full_url = urljoin(
                  BASE_URL,
                  href
              )

              parsed = urlparse(full_url)

              if parsed.netloc != "www.bbc.com":
                  continue

              if not parsed.path.startswith(
                  "/turkce"
              ):
                  continue

              clean_url = (
                  f"{parsed.scheme}://"
                  f"{parsed.netloc}"
                  f"{parsed.path}"
              )

              text = a.get_text(
                  " ",
                  strip=True
              )

              text = " ".join(
                  text.split()
              )

              if not text:
                  continue

              if clean_url == BASE_URL:
                  continue

              article_words = [
                  "/articles/",
                  "/features/",
                  "/turkce/haberler/"
              ]

              is_article = any(
                  word in parsed.path
                  for word in article_words
              )

              if not is_article:
                  continue

              if clean_url in [
                  item["url"]
                  for item in links
              ]:
                  continue

              links.append({
                  "url": clean_url,
                  "title": text
              })


          print(
              "Bulunan haber adayı:",
              len(links)
          )

          print("")

          selected = links[:5]

          print(
              "İlk",
              len(selected),
              "haber indirilecek."
          )

          print("")

          successful_articles = []

          for index, item in enumerate(
              selected,
              start=1
          ):

              url = item["url"]

              print("======================================")
              print(
                  f"HABER {index}"
              )
              print("URL:", url)
              print("")

              status, article_html = download_page(
                  url
              )

              if not article_html:

                  print(
                      "SONUÇ: Haber indirilemedi."
                  )
                  print("")
                  continue

              print(
                  "HTTP:",
                  status
              )

              print(
                  "HTML karakter sayısı:",
                  len(article_html)
              )

              article_soup = BeautifulSoup(
                  article_html,
                  "html.parser"
              )

              for tag in article_soup([
                  "script",
                  "style",
                  "noscript",
                  "svg",
                  "nav",
                  "footer",
                  "header",
                  "form"
              ]):

                  tag.decompose()

              title = ""

              if article_soup.title:

                  title = article_soup.title.get_text(
                      " ",
                      strip=True
                  )

              main = article_soup.find(
                  "main"
              )

              if main:

                  article_text = main.get_text(
                      " ",
                      strip=True
                  )

              else:

                  article_text = article_soup.get_text(
                      " ",
                      strip=True
                  )

              article_text = " ".join(
                  article_text.split()
              )

              print("")
              print("SAYFA BAŞLIĞI:")
              print(title)

              print("")
              print(
                  "TEMİZ METİN KARAKTER SAYISI:",
                  len(article_text)
              )

              if len(article_text) < 200:

                  print("")
                  print(
                      "UYARI: Haber metni çok kısa."
                  )

              else:

                  successful_articles.append({
                      "url": url,
                      "title": title,
                      "text": article_text
                  })

                  print("")
                  print(
                      "METİN BAŞLANGICI:"
                  )

                  print(
                      article_text[:1500]
                  )

              print("")


          print("======================================")
          print("ÖZET")
          print("======================================")
          print("")

          print(
              "Toplam haber adayı:",
              len(selected)
          )

          print(
              "Başarıyla metni alınan haber:",
              len(successful_articles)
          )

          print("")

          for index, article in enumerate(
              successful_articles,
              start=1
          ):

              print(
                  f"{index}.",
                  article["title"]
              )

              print(
                  "   Metin:",
                  len(article["text"]),
                  "karakter"
              )

              print(
                  "   URL:",
                  article["url"]
              )

          print("")
          print("======================================")
          print("HABER METİN CRAWLER TESTİ TAMAMLANDI")
          print("======================================")
          PY

          python crawler.py
