name: WebProof AI - Temiz Haber Metni Testi

on:
  workflow_dispatch:

jobs:
  webproof-clean-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4 requests

      - name: WebProof AI temiz metin testi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > webproof_test.py <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from google import genai
          import re
          import time
          import os
          from urllib.parse import urljoin, urlparse

          BBC_URL = "https://www.bbc.com/turkce"
          BBC_DOMAIN = "www.bbc.com"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/139.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "tr-TR,tr;q=0.9,en;q=0.8"
          }

          print("=" * 70)
          print("WEBPROOF AI - TEMİZ HABER METNİ TESTİ")
          print("=" * 70)

          # ============================================================
          # 1. BBC ANA SAYFASINI İNDİR
          # ============================================================

          print("\n[1] BBC ana sayfası indiriliyor...")

          try:
              response = requests.get(
                  BBC_URL,
                  headers=HEADERS,
                  timeout=20
              )
              response.raise_for_status()
          except Exception as e:
              print("BBC bağlantı hatası:", e)
              raise

          print("HTTP:", response.status_code)
          print("HTML uzunluğu:", len(response.text))

          soup = BeautifulSoup(response.text, "html.parser")

          # ============================================================
          # 2. HABER BAĞLANTILARINI BUL
          # ============================================================

          print("\n[2] Haber bağlantıları aranıyor...")

          article_urls = []

          for a in soup.find_all("a", href=True):

              href = a.get("href", "").strip()

              if not href:
                  continue

              # Göreli veya tam URL'yi normalize et
              full_url = urljoin(BBC_URL, href)

              parsed = urlparse(full_url)

              # Sadece BBC
              if parsed.netloc not in [
                  "www.bbc.com",
                  "bbc.com"
              ]:
                  continue

              path = parsed.path

              # --------------------------------------------------------
              # BBC Türkçe haber adresleri:
              #
              # /turkce/articles/...
              # /turkce/articles/...?...
              #
              # Ayrıca bazı BBC sayfalarında farklı uzantılar olabilir.
              # Önceliği articles adreslerine veriyoruz.
              # --------------------------------------------------------

              if path.startswith("/turkce/articles/"):

                  clean_url = (
                      "https://www.bbc.com"
                      + path
                  )

                  if clean_url not in article_urls:
                      article_urls.append(clean_url)

          print(
              "BBC /turkce/articles bağlantısı:",
              len(article_urls)
          )

          # ============================================================
          # 3. EĞER 0 İSE HTML'DEKİ BBC TÜRKÇE LİNKLERİNİ İNCELE
          # ============================================================

          if len(article_urls) == 0:

              print(
                  "\nUYARI: /turkce/articles/ filtresiyle "
                  "haber bulunamadı."
              )

              print(
                  "BBC sayfasındaki örnek bağlantılar inceleniyor..."
              )

              debug_links = []

              for a in soup.find_all("a", href=True):

                  href = a.get("href", "").strip()

                  if "/turkce/" in href:

                      if href not in debug_links:
                          debug_links.append(href)

              print(
                  "\nBulunan BBC Türkçe bağlantı örnekleri:"
              )

              for link in debug_links[:30]:
                  print("-", link)

              # HTML içinde articles kelimesini ara
              articles_count = response.text.count(
                  "/turkce/articles/"
              )

              print(
                  "\nHTML içinde '/turkce/articles/' sayısı:",
                  articles_count
              )

              raise RuntimeError(
                  "BBC haber bağlantıları bulunamadı. "
                  "HTML yapısı değişmiş olabilir."
              )

          # İlk 5 haber
          article_urls = article_urls[:5]

          print("\nTest edilecek haberler:")

          for i, url in enumerate(article_urls, 1):
              print(f"{i}. {url}")

          # ============================================================
          # 4. TEMİZ HABER METNİ ÇIKARMA
          # ============================================================

          def extract_clean_article(url):

              print("\n" + "-" * 70)
              print("Haber indiriliyor:")
              print(url)

              try:

                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=20
                  )

                  print("HTTP:", r.status_code)

                  if r.status_code != 200:
                      return None

                  page = BeautifulSoup(
                      r.text,
                      "html.parser"
                  )

                  # ----------------------------------------------------
                  # Gereksiz HTML elementleri
                  # ----------------------------------------------------

                  remove_tags = [
                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer",
                      "header",
                      "form",
                      "aside",
                      "iframe"
                  ]

                  for tag_name in remove_tags:

                      for tag in page.find_all(tag_name):
                          tag.decompose()

                  # ----------------------------------------------------
                  # Ana içerik alanını bul
                  # ----------------------------------------------------

                  main = page.find("main")

                  if main:
                      container = main
                  else:
                      container = page.body

                  if not container:
                      return None

                  # ----------------------------------------------------
                  # Başlık
                  # ----------------------------------------------------

                  title = ""

                  h1 = container.find("h1")

                  if h1:

                      title = h1.get_text(
                          " ",
                          strip=True
                      )

                  # ----------------------------------------------------
                  # Gereksiz içerik filtreleri
                  # ----------------------------------------------------

                  bad_phrases = [
                      "WhatsApp",
                      "Haberin başlığını atlayın",
                      "okumaya devam edin",
                      "En çok okunanlar",
                      "Bizi takip edin",
                      "BBC News Türkçe",
                      "Çerez",
                      "Gizlilik",
                      "Kullanım koşulları",
                      "Menü",
                      "Ana sayfa",
                      "Bildirimleri açın",
                      "Uygulamayı indirin",
                      "Sosyal medyada takip edin"
                  ]

                  # ----------------------------------------------------
                  # Önce açıkça gereksiz alanları temizle
                  # ----------------------------------------------------

                  for element in container.find_all(
                      [
                          "div",
                          "section",
                          "aside"
                      ]
                  ):

                      text = element.get_text(
                          " ",
                          strip=True
                      )

                      if not text:
                          continue

                      lower_text = text.lower()

                      if any(
                          phrase.lower() in lower_text
                          for phrase in bad_phrases
                      ):

                          # Çok büyük bir container ise
                          # yanlışlıkla tüm makaleyi silmemek için
                          # yalnızca küçük/orta bloklarda uygula.
                          if len(text) < 1500:
                              element.decompose()

                  # ----------------------------------------------------
                  # Paragrafları çıkar
                  # ----------------------------------------------------

                  paragraphs = []

                  for p in container.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if not text:
                          continue

                      # Çok kısa navigasyon parçalarını çıkar
                      if len(text) < 25:
                          continue

                      lower_text = text.lower()

                      if any(
                          phrase.lower() in lower_text
                          for phrase in bad_phrases
                      ):
                          continue

                      # Fazla boşluk
                      text = re.sub(
                          r"\s+",
                          " ",
                          text
                      ).strip()

                      paragraphs.append(text)

                  # ----------------------------------------------------
                  # Tekrarlanan paragrafları kaldır
                  # ----------------------------------------------------

                  unique_paragraphs = []

                  seen = set()

                  for text in paragraphs:

                      key = text.lower()

                      if key in seen:
                          continue

                      seen.add(key)

                      unique_paragraphs.append(text)

                  # ----------------------------------------------------
                  # Son metin
                  # ----------------------------------------------------

                  parts = []

                  if title:
                      parts.append(title)

                  parts.extend(unique_paragraphs)

                  text = "\n\n".join(parts)

                  text = re.sub(
                      r"\n{3,}",
                      "\n\n",
                      text
                  )

                  text = re.sub(
                      r"[ \t]{2,}",
                      " ",
                      text
                  )

                  text = text.strip()

                  if len(text) < 200:

                      print(
                          "UYARI: Temiz metin çok kısa:",
                          len(text)
                      )

                  return {
                      "title": title,
                      "text": text
                  }

              except Exception as e:

                  print("Haber işleme hatası:", e)

                  return None

          # ============================================================
          # 5. HABERLERİ TEMİZLE
          # ============================================================

          articles = []

          for i, url in enumerate(article_urls, 1):

              result = extract_clean_article(url)

              if not result:

                  print(
                      "Metin alınamadı."
                  )

                  continue

              text = result["text"]

              print(
                  "Başlık:",
                  result["title"]
              )

              print(
                  "Temiz metin uzunluğu:",
                  len(text)
              )

              print("\nİlk 500 karakter:")

              print(text[:500])

              articles.append({
                  "url": url,
                  "title": result["title"],
                  "text": text
              })

          # ============================================================
          # 6. TEMİZLEME SONUCU
          # ============================================================

          print("\n" + "=" * 70)
          print("TEMİZ METİN TEST SONUCU")
          print("=" * 70)

          print(
              "Toplam haber:",
              len(articles)
          )

          for i, article in enumerate(
              articles,
              1
          ):

              print(
                  f"{i}. "
                  f"{len(article['text'])} karakter - "
                  f"{article['title']}"
              )

          # ============================================================
          # 7. GEMINI YAZIM DENETİMİ
          # ============================================================

          if not articles:

              raise RuntimeError(
                  "Analiz edilecek haber bulunamadı."
              )

          print("\n" + "=" * 70)
          print("GEMINI YAZIM DENETİMİ")
          print("=" * 70)

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          for i, article in enumerate(
              articles,
              1
          ):

              print("\n" + "-" * 70)

              print(
                  f"GEMINI TESTİ "
                  f"{i}/{len(articles)}"
              )

              print(
                  article["title"]
              )

              prompt = f"""
          Sen profesyonel bir Türkçe haber editörüsün.

          Aşağıdaki haber metnini yalnızca açık ve kesin:

          - yazım yanlışları
          - noktalama yanlışları
          - bariz dilbilgisi hataları

          açısından kontrol et.

          Emin olmadığın ifadeleri HATA olarak gösterme.

          Siyasi, hukuki, ekonomik veya haber dilindeki
          tercihleri gereksiz yere değiştirme.

          Özel isimleri ve kurum isimlerini değiştirme.

          Her hata için:

          HATA:
          DÜZELTME:
          NEDEN:

          formatını kullan.

          Eğer açık bir hata yoksa:

          Açık bir yazım veya dilbilgisi hatası bulunamadı.

          yaz.

          HABER:

          {article["text"][:10000]}
          """

              success = False

              for attempt, delay in [
                  (1, 0),
                  (2, 5),
                  (3, 10),
                  (4, 20)
              ]:

                  if delay:
                      time.sleep(delay)

                  try:

                      print(
                          f"Gemini denemesi "
                          f"{attempt}/4..."
                      )

                      result = client.models.generate_content(
                          model="gemini-3.6-flash",
                          contents=prompt
                      )

                      print(
                          "\nGEMINI SONUCU:\n"
                      )

                      print(
                          result.text
                      )

                      success = True

                      break

                  except Exception as e:

                      print(
                          "Gemini hatası:",
                          e
                      )

              if not success:

                  print(
                      "Bu haber için Gemini "
                      "analizi başarısız."
                  )

          print("\n" + "=" * 70)
          print("TEST TAMAMLANDI")
          print("=" * 70)
          PY

          python webproof_test.py
