name: WebProof AI - BBC 5 Haber Gemini

on:
  workflow_dispatch:

jobs:
  spelling-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4

      - name: BBC haberlerini Gemini ile kontrol et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > spelling.py <<'PY'
          import os
          import time
          import urllib.request
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup
          from google import genai

          BASE_URL = "https://www.bbc.com/turkce"

          print("======================================")
          print("WEBPROOF AI")
          print("BBC 5 HABER GEMINI YAZIM DENETİMİ")
          print("======================================")
          print("")

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY bulunamadı."
              )

          client = genai.Client(
              api_key=api_key
          )


          def download_page(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      html = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      return response.status, html

              except Exception as error:

                  print("Sayfa indirilemedi:")
                  print(error)

                  return None, None


          def clean_text(soup):

              for tag in soup([
                  "script",
                  "style",
                  "noscript",
                  "svg",
                  "nav",
                  "footer",
                  "header",
                  "form"
              ]):

                  tag.decompose()


              main = soup.find("main")

              if main:

                  text = main.get_text(
                      " ",
                      strip=True
                  )

              else:

                  text = soup.get_text(
                      " ",
                      strip=True
                  )


              text = " ".join(
                  text.split()
              )

              return text


          print("BBC Türkçe ana sayfası indiriliyor...")

          status, html = download_page(
              BASE_URL
          )

          if not html:
              raise RuntimeError(
                  "BBC ana sayfası indirilemedi."
              )

          print(
              "Ana sayfa HTTP:",
              status
          )

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          links = []

          for a in soup.find_all(
              "a",
              href=True
          ):

              href = a.get("href")

              if not href:
                  continue

              full_url = urljoin(
                  BASE_URL,
                  href
              )

              parsed = urlparse(
                  full_url
              )

              if parsed.netloc != "www.bbc.com":
                  continue

              if not parsed.path.startswith(
                  "/turkce"
              ):
                  continue

              article_words = [
                  "/articles/",
                  "/features/",
                  "/turkce/haberler/"
              ]

              is_article = any(
                  word in parsed.path
                  for word in article_words
              )

              if not is_article:
                  continue

              clean_url = (
                  f"{parsed.scheme}://"
                  f"{parsed.netloc}"
                  f"{parsed.path}"
              )

              title = a.get_text(
                  " ",
                  strip=True
              )

              title = " ".join(
                  title.split()
              )

              if not title:
                  continue

              if clean_url in [
                  item["url"]
                  for item in links
              ]:
                  continue

              links.append({
                  "url": clean_url,
                  "title": title
              })


          selected = links[:5]

          print("")
          print(
              "Gemini ile kontrol edilecek haber:",
              len(selected)
          )
          print("")


          results = []


          for index, item in enumerate(
              selected,
              start=1
          ):

              url = item["url"]

              print("")
              print("======================================")
              print(
                  f"HABER {index}"
              )
              print("======================================")
              print("URL:", url)
              print("")

              status, article_html = download_page(
                  url
              )

              if not article_html:

                  print(
                      "HABER İNDİRİLEMEDİ."
                  )

                  continue


              article_soup = BeautifulSoup(
                  article_html,
                  "html.parser"
              )


              page_title = ""

              if article_soup.title:

                  page_title = (
                      article_soup.title.get_text(
                          " ",
                          strip=True
                      )
                  )


              article_text = clean_text(
                  article_soup
              )


              print(
                  "Metin uzunluğu:",
                  len(article_text),
                  "karakter"
              )


              if len(article_text) < 200:

                  print(
                      "UYARI: Yeterli haber metni alınamadı."
                  )

                  continue


              article_text = article_text[:10000]


              prompt = f"""
          Sen WebProof AI'ın Türkçe yazım denetimi uzmanısın.

          Aşağıdaki haber metnini dikkatlice incele.

          SADECE şu hataları tespit et:

          1. Yazım yanlışları
          2. Noktalama yanlışları
          3. Açık ve kesin dilbilgisi yanlışları

          KURALLAR:

          - Emin olmadığın ifadeyi hata olarak gösterme.
          - Özel isimleri hata olarak gösterme.
          - Haber üslubunu hata olarak gösterme.
          - Aynı hatayı tekrar listeleme.
          - Sadece açık ve kesin hatalara odaklan.
          - Bir kelimenin birden fazla doğru kullanımı varsa
            bunu hata olarak işaretleme.
          - Sayfadaki menü, reklam, sosyal medya,
            WhatsApp duyurusu veya navigasyon metinlerini
            haber metni olarak değerlendirme.
          - Bir hata bulduğunda ilgili ifadeyi mümkün olduğunca
            kısa şekilde göster.

          Her hata için şu formatı kullan:

          HATA 1
          YANLIŞ: ...
          DOĞRU: ...
          NEDEN: ...
          GÜVEN: Yüksek / Orta

          HATA 2
          YANLIŞ: ...
          DOĞRU: ...
          NEDEN: ...
          GÜVEN: Yüksek / Orta

          Belirgin hata yoksa:

          BELİRGİN YAZIM HATASI BULUNAMADI

          yaz.

          HABER BAŞLIĞI:
          {page_title}

          URL:
          {url}

          HABER METNİ:
          {article_text}
          """


              response = None

              retry_delay = 5


              for attempt in range(
                  1,
                  5
              ):

                  try:

                      print(
                          f"Gemini denemesi "
                          f"{attempt}/4"
                      )

                      response = (
                          client.models.generate_content(
                              model="gemini-3.6-flash",
                              contents=prompt
                          )
                      )

                      print(
                          "Gemini başarılı."
                      )

                      break

                  except Exception as error:

                      print("")
                      print(
                          "Gemini hatası:"
                      )
                      print(error)
                      print("")

                      if attempt == 4:

                          print(
                              "4 denemenin tamamı "
                              "başarısız oldu."
                          )

                          break

                      print(
                          f"{retry_delay} saniye sonra "
                          "tekrar denenecek..."
                      )

                      time.sleep(
                          retry_delay
                      )

                      retry_delay *= 2


              if response is None:

                  print(
                      "Bu haber için Gemini sonucu alınamadı."
                  )

                  continue


              result_text = response.text

              results.append({
                  "title": page_title,
                  "url": url,
                  "result": result_text
              })


              print("")
              print("--------------------------------------")
              print("GEMINI SONUCU")
              print("--------------------------------------")
              print("")
              print(result_text)
              print("")


          print("")
          print("======================================")
          print("WEBPROOF AI GENEL SONUÇ")
          print("======================================")
          print("")

          print(
              "Toplam haber:",
              len(selected)
          )

          print(
              "Gemini tarafından analiz edilen:",
              len(results)
          )

          print("")

          for index, result in enumerate(
              results,
              start=1
          ):

              print(
                  f"HABER {index}:",
                  result["title"]
              )

              print(
                  result["result"]
              )

              print("")
              print("--------------------------------------")
              print("")


          print("======================================")
          print("TEST TAMAMLANDI")
          print("======================================")
          PY

          python spelling.py
