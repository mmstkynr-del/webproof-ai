name: WebProof AI - BBC Link Crawler

on:
  workflow_dispatch:

jobs:
  crawler-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: BBC Türkçe bağlantılarını bul
        run: |
          cat > crawler.py <<'PY'
          import urllib.request
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup

          BASE_URL = "https://www.bbc.com/turkce"

          print("======================================")
          print("WEBPROOF AI")
          print("BBC TÜRKÇE LINK CRAWLER")
          print("======================================")
          print("")
          print("Ana sayfa:", BASE_URL)
          print("")
          print("BBC Türkçe ana sayfası indiriliyor...")

          request = urllib.request.Request(
              BASE_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("HTTP:", response.status)
          print("HTML karakter sayısı:", len(html))
          print("")

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          links = []

          for a in soup.find_all("a", href=True):

              href = a.get("href")

              if not href:
                  continue

              full_url = urljoin(
                  BASE_URL,
                  href
              )

              parsed = urlparse(full_url)

              if parsed.netloc != "www.bbc.com":
                  continue

              if not parsed.path.startswith("/turkce"):
                  continue

              clean_url = (
                  f"{parsed.scheme}://"
                  f"{parsed.netloc}"
                  f"{parsed.path}"
              )

              text = a.get_text(
                  " ",
                  strip=True
              )

              text = " ".join(
                  text.split()
              )

              if not text:
                  continue

              if clean_url == BASE_URL:
                  continue

              if clean_url not in [
                  item["url"] for item in links
              ]:

                  links.append({
                      "url": clean_url,
                      "text": text
                  })

          print("Toplam benzersiz BBC Türkçe bağlantısı:")
          print(len(links))
          print("")

          print("======================================")
          print("BULUNAN BAĞLANTILAR")
          print("======================================")
          print("")

          article_candidates = []

          for item in links:

              url = item["url"]
              text = item["text"]

              path = urlparse(url).path

              article_words = [
                  "/articles/",
                  "/features/",
                  "/turkce/haberler/"
              ]

              is_article = any(
                  word in path
                  for word in article_words
              )

              if is_article:

                  article_candidates.append(item)

          print(
              "Haber/makale adayı bağlantı sayısı:",
              len(article_candidates)
          )

          print("")

          selected = article_candidates[:10]

          for index, item in enumerate(
              selected,
              start=1
          ):

              print("--------------------------------------")
              print(f"HABER ADAYI {index}")
              print("BAŞLIK:", item["text"])
              print("URL:", item["url"])
              print("--------------------------------------")
              print("")

          print("======================================")
          print("CRAWLER TESTİ TAMAMLANDI")
          print("======================================")
          PY

          python crawler.py
