name: WebProof AI - NVIDIA Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install openai requests beautifulsoup4

      - name: Run
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python nvidia_test.py
