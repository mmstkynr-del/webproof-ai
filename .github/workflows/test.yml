name: WebProof AI - Gemini Test

on:
  workflow_dispatch:

jobs:
  gemini-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gemini SDK kurulumu
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai

      - name: Gemini testi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY GitHub Secret olarak bulunamadı.")

          print("Gemini API anahtarı bulundu.")
          print("Gemini'ye bağlanılıyor...")

          client = genai.Client(api_key=api_key)

          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents="Merhaba. WebProof AI için çalışan bir yapay zeka ajanısın. Görevinin ne olduğunu tek cümleyle söyle."
          )

          print("")
          print("==============================")
          print("GEMINI CEVABI")
          print("==============================")
          print(response.text)
          print("==============================")
          PY
