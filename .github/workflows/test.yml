name: WebProof AI - NanoBot Test

on:
  workflow_dispatch:

jobs:
  nanobot-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kontrolü
        run: |
          python --version
          pip --version

      - name: NanoBot kurulumu
        run: |
          pip install nanobot-ai

      - name: NanoBot kontrolü
        run: |
          nanobot --help
