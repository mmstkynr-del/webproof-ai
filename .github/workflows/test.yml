name: WebProof AI - NanoBot Gemini

on:
  workflow_dispatch:

jobs:
  nanobot-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: NanoBot kurulumu
        run: |
          python -m pip install --upgrade pip
          pip install nanobot-ai

      - name: NanoBot kontrolü
        run: |
          nanobot --help

      - name: Gemini API kontrolü
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents="""
              Sen WebProof AI'ın yapay zeka ajanısın.
              Görevin web sitelerini takip etmek,
              değişiklikleri tespit etmek ve kullanıcıya bildirmektir.

              Şimdilik sadece şunu söyle:
              NanoBot ve Gemini bağlantısı başarılı.
              """
          )

          print(response.text)
          PY
