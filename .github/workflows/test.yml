name: WebProof AI - Gemini Test

on:
  workflow_dispatch:

jobs:
  gemini-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gemini SDK kurulumu
        run: |
          pip install google-genai

      - name: Gemini testi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          response = client.models.generate_content(
              model="gemini-2.5-flash",
              contents="Merhaba. WebProof AI için çalışan bir yapay zeka ajanısın. Bana tek cümleyle görevinin ne olduğunu söyle."
          )

          print("===================================")
          print("GEMINI CEVABI:")
          print("===================================")
          print(response.text)
          print("===================================")
          PY
