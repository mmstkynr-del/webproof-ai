name: WebProof AI - BBC Yazım Kontrolü

on:
  workflow_dispatch:

jobs:
  spelling-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4

      - name: BBC Türkçe sayfasını kontrol et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > test.py <<'PY'
          import os
          import time
          import urllib.request
          from bs4 import BeautifulSoup
          from google import genai

          URL = "https://www.bbc.com/turkce"

          print("======================================")
          print("WEBPROOF AI")
          print("BBC TÜRKÇE YAZIM KONTROLÜ")
          print("======================================")

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY bulunamadı.")

          print("BBC Türkçe indiriliyor...")

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("HTTP:", response.status)
          print("HTML karakter sayısı:", len(html))

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          for tag in soup([
              "script",
              "style",
              "noscript",
              "svg"
          ]):
              tag.decompose()

          title = ""

          if soup.title:
              title = soup.title.get_text(
                  " ",
                  strip=True
              )

          main = soup.find("main")

          if main:
              text = main.get_text(
                  " ",
                  strip=True
              )
          else:
              text = soup.get_text(
                  " ",
                  strip=True
              )

          text = " ".join(text.split())

          print("Sayfa başlığı:", title)
          print("Temiz metin karakter sayısı:", len(text))

          if len(text) < 100:
              raise RuntimeError(
                  "BBC sayfasından yeterli metin alınamadı."
              )

          text = text[:15000]

          prompt = f"""
          Sen WebProof AI'ın Türkçe yazım denetimi uzmanısın.

          Aşağıdaki BBC Türkçe sayfasını incele.

          Sadece:
          - Yazım yanlışları
          - Noktalama yanlışları
          - Açık dilbilgisi yanlışları

          bul.

          Emin olmadığın ifadeyi hata olarak gösterme.
          Özel isimleri hata olarak gösterme.
          Haber üslubunu hata kabul etme.
          Aynı hatayı tekrar listeleme.

          Her hata için:

          HATA:
          YANLIŞ:
          DOĞRU:
          NEDEN:
          GÜVEN:

          formatını kullan.

          Belirgin hata yoksa:

          BELİRGİN YAZIM HATASI BULUNAMADI

          yaz.

          BAŞLIK:
          {title}

          URL:
          {URL}

          METİN:
          {text}
          """

          print("")
          print("Gemini analizine başlanıyor...")

          client = genai.Client(
              api_key=api_key
          )

          response = None
          delay = 5

          for attempt in range(1, 5):
              try:
                  print(
                      f"Gemini denemesi {attempt}/4"
                  )

                  response = client.models.generate_content(
                      model="gemini-3.6-flash",
                      contents=prompt
                  )

                  break

              except Exception as error:
                  print("Gemini hatası:", error)

                  if attempt == 4:
                      raise

                  time.sleep(delay)
                  delay *= 2

          print("")
          print("======================================")
          print("WEBPROOF AI SONUCU")
          print("======================================")
          print("")

          print(response.text)

          print("")
          print("======================================")
          print("TEST TAMAMLANDI")
          print("======================================")
          PY

          python test.py
